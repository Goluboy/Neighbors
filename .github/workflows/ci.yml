# Backend-only workflow. A frontend may be added later and will get its own workflow.
name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  checks:
    name: backend — lint, layers, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Prepare env file
        run: cp .env.example .env

      - name: Pre-commit (ruff, formatting, layer boundaries, hygiene)
        working-directory: ${{ github.workspace }}
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Type-check (mypy, clean layers)
        run: make typecheck

      - name: Layer boundaries
        run: make layers

      - name: Tests
        run: make test

  compose:
    name: backend — docker compose config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Prepare env file
        run: cp .env.example .env

      - name: Validate compose file
        run: docker compose config
